name: Apply Account interaction polish

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-account-interaction-polish.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix-account-navigation-and-feedback'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix-account-navigation-and-feedback
          fetch-depth: 0

      - name: Load interaction assets on the Account page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/account/index.html')
          html = path.read_text()

          css_tag = '  <link rel="stylesheet" href="/account-interaction-polish.css?v=20260804-1">'
          if css_tag not in html:
              anchor = '  <link rel="stylesheet" href="/account-final-refinement.css?v=20260804-12">'
              if anchor not in html:
                  raise SystemExit('Account stylesheet anchor not found.')
              html = html.replace(anchor, anchor + '\n' + css_tag, 1)

          script_tag = '  <script src="/account-interaction-polish.js?v=20260804-1" defer></script>'
          if script_tag not in html:
              anchor = '  <script src="/admin-email-test.js?v=20260801-1" defer></script>'
              if anchor not in html:
                  raise SystemExit('Account script anchor not found.')
              html = html.replace(anchor, anchor + '\n' + script_tag, 1)

          path.write_text(html)
          Path('.github/workflows/apply-account-interaction-polish.yml').unlink()
          PY

      - name: Run tests and syntax checks
        run: |
          npm test
          npm run check

      - name: Commit the patched Account page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Account navigation and save feedback"
          git push origin HEAD:fix-account-navigation-and-feedback
