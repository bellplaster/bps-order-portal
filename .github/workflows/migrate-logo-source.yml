name: Migrate logo source

on:
  push:
    paths:
      - .github/workflows/migrate-logo-source.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Shopify logo URL with Cloudflare R2
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://bellplastersupplies.com.au/cdn/shop/files/bell_logo_black.png?v=1781229976"
          new = "https://assets.bellplaster.com.au/bell_logo_black.png"
          paths = [
              Path("functions/_shared/order-email.js"),
              Path("public/index.html"),
              Path("public/account/index.html"),
          ]

          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one old logo URL in {path}, found {count}.")
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed.append(str(path))

          print("Updated:", ", ".join(changed))
          PY

      - name: Verify logo references
        run: |
          ! grep -R "bellplastersupplies.com.au/cdn/shop/files/bell_logo_black.png" functions/_shared/order-email.js public/index.html public/account/index.html
          grep -R "https://assets.bellplaster.com.au/bell_logo_black.png" functions/_shared/order-email.js public/index.html public/account/index.html

      - name: Run regression tests
        run: npm test

      - name: Run JavaScript syntax checks
        run: npm run check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_shared/order-email.js public/index.html public/account/index.html
          git commit -m "Serve portal logos from Cloudflare R2"
          git push
