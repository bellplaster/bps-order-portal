name: Apply saved address icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-saved-address-icon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace Saved Addresses icon
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('public/account-interaction-polish.js')
          text = js.read_text()
          old = '''    addresses: `
      <span class="account-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path fill="currentColor" d="m12 3.8 7.7 6.9a.75.75 0 1 1-1 1.1l-.95-.86V19a2 2 0 0 1-2 2h-7.5a2 2 0 0 1-2-2v-8.06l-.95.86a.75.75 0 1 1-1-1.1Zm4.25 6.15L12 6.13 7.75 9.95V19a.5.5 0 0 0 .5.5h.5v-4.75A1.75 1.75 0 0 1 10.5 13h3a1.75 1.75 0 0 1 1.75 1.75v4.75h.5a.5.5 0 0 0 .5-.5Zm-3 9.55v-4.75a.25.25 0 0 0-.25-.25h-2a.25.25 0 0 0-.25.25v4.75Z"/>
        </svg>
      </span>`,'''
          new = '''    addresses: `
      <span class="account-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" focusable="false">
          <path d="M9 17h6M3 14.6v-2.47c0-1.149 0-1.723.148-2.252a5.53 5.53 0 0 1 .636-1.3c.327-.442.78-.795 1.687-1.5l2.6-2.022c1.405-1.093 2.108-1.64 2.884-1.85a4 4 0 0 1 2.09 0c.776.21 1.479.757 2.884 1.85l2.6 2.022c.907.705 1.36 1.058 1.687 1.5.289.39.505.831.636 1.3.148.529.148 1.103.148 2.252v2.47c0 2.24 0 3.36-.436 4.216a4 4 0 0 1-1.748 1.748C17.96 21 16.84 21 14.6 21H9.4c-2.24 0-3.36 0-4.216-.436a4 4 0 0 1-1.748-1.748C3 17.96 3 16.84 3 14.6Z" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>`,'''
          if old not in text:
              raise SystemExit('Existing address icon block not found')
          js.write_text(text.replace(old, new))

          html = Path('public/account/index.html')
          html.write_text(html.read_text().replace(
              '/account-interaction-polish.js?v=20260804-2',
              '/account-interaction-polish.js?v=20260804-3'
          ))

          test = Path('tests/account-interaction-polish.test.mjs')
          test_text = test.read_text().replace(
              'account-interaction-polish\\.js\\?v=20260804-2',
              'account-interaction-polish\\.js\\?v=20260804-3'
          )
          test_text += '''\n\ntest("Saved Addresses uses the supplied line-house SVG", () => {\n  assert.match(script, /addresses:[\\s\\S]*M9 17h6M3 14\\.6/);\n  assert.match(script, /stroke=\"currentColor\"/);\n  assert.match(script, /stroke-width=\"1\\.55\"/);\n});\n'''
          test.write_text(test_text)
          PY
      - run: npm test
      - run: npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/account-interaction-polish.js public/account/index.html tests/account-interaction-polish.test.mjs
          git commit -m "Use supplied line-house icon for saved addresses"
          git push origin HEAD:main
