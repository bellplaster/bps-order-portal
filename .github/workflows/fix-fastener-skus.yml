name: One-time fastener SKU correction

on:
  push:
    paths:
      - .github/workflows/fix-fastener-skus.yml

permissions:
  contents: write

jobs:
  correct-fastener-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct SKU mapping and remove duplicate Partiwall items
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('public/sku-source-truth.js')
          source = source_path.read_text(encoding='utf-8')

          old_mapping = '"COLLATED|COARSE (W)|25 MM": "CNPBUZYC0632-PWR"'
          new_mapping = '"COLLATED|COARSE (W)|25 MM": "CNPBUZYC0625-PWR"'
          if old_mapping not in source:
              raise SystemExit('Expected incorrect 25 mm collated coarse mapping was not found.')
          source = source.replace(old_mapping, new_mapping, 1)

          duplicate_rows = [
              '      ["25mm Coarse NP", "", "NPBUZYCO725-PWR"],\n',
              '      ["32mm Coarse NP", "", "NPBUZYCO732-PWR"],\n',
          ]
          for row in duplicate_rows:
              if row not in source:
                  raise SystemExit(f'Expected duplicate Partiwall row was not found: {row.strip()}')
              source = source.replace(row, '', 1)

          source_path.write_text(source, encoding='utf-8')

          index_path = Path('public/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              '/sku-source-truth.js?v=20260729-2',
              '/sku-source-truth.js?v=20260730-1',
              1,
          )
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Verify corrected fastener SKUs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('public/sku-source-truth.js').read_text(encoding='utf-8')
          expected = {
              'LOOSE|COARSE (W)|25 MM': 'NPBUZYCO725-PWR',
              'LOOSE|COARSE (W)|32 MM': 'NPBUZYCO732-PWR',
              'COLLATED|COARSE (W)|25 MM': 'CNPBUZYC0625-PWR',
              'COLLATED|COARSE (W)|32 MM': 'CNPBUZYC0632-PWR',
          }
          for signature, sku in expected.items():
              needle = f'"{signature}": "{sku}"'
              if needle not in source:
                  raise SystemExit(f'Missing corrected mapping: {needle}')

          if '25mm Coarse NP' in source or '32mm Coarse NP' in source:
              raise SystemExit('Duplicate Partiwall coarse NP rows still exist.')

          skus = re.findall(r'"(?:LOOSE|COLLATED)\|[^\"]+": "([^\"]+)"', source)
          duplicates = sorted({sku for sku in skus if skus.count(sku) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate fastener SKUs remain: {duplicates}')
          print('Fastener SKU verification passed.')
          PY

      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name "Bell Plaster Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-fastener-skus.yml
          git add public/sku-source-truth.js public/index.html
          git commit -m "Correct fastener SKUs and remove Partiwall duplicates"
          git push origin main
