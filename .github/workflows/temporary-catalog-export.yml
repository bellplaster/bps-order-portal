name: Temporary catalogue export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'catalog-sheet-export-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export catalogue and layout
        shell: bash
        run: |
          mkdir -p export
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { PRODUCT_CATALOG, ORDER_FORM_LAYOUT } from './functions/_shared/catalog.js';

          const exportData = {
            generatedAt: new Date().toISOString(),
            repository: 'bellplaster/bps-order-portal',
            branch: process.env.GITHUB_HEAD_REF,
            commit: process.env.GITHUB_SHA,
            productCount: Object.keys(PRODUCT_CATALOG).length,
            products: PRODUCT_CATALOG,
            layout: ORDER_FORM_LAYOUT,
          };
          await writeFile('export/order-form-catalog.json', JSON.stringify(exportData, null, 2));

          const quote = (value) => {
            const text = Array.isArray(value) ? value.join('|') : String(value ?? '');
            return `"${text.replaceAll('"', '""')}"`;
          };
          const productRows = [
            ['Product Key','Mapping ID','Section','Label','SKU','Description','Floors','Mapped'],
            ...Object.entries(PRODUCT_CATALOG).map(([key, p]) => [
              key, p.mappingId, p.section, p.label, p.sku, p.description, p.floors, p.mapped,
            ]),
          ];
          await writeFile('export/master-products.csv', productRows.map(row => row.map(quote).join(',')).join('\n'));

          const placements = [];
          let sequence = 0;
          const addPlacement = (data) => placements.push({ sequence: ++sequence, ...data });

          const mainBoard = ORDER_FORM_LAYOUT?.mainBoard || {};
          const groups = mainBoard.groups || [];
          const groupByColumn = [];
          for (const group of groups) {
            for (let i = 0; i < Number(group.span || 0); i += 1) groupByColumn.push(group);
          }
          (mainBoard.rows || []).forEach((row) => {
            (row.cells || []).forEach((key, columnIndex) => {
              if (!key) return;
              const column = (mainBoard.columns || [])[columnIndex] || {};
              const group = groupByColumn[columnIndex] || {};
              addPlacement({ sectionId: 'mainBoard', sectionTitle: mainBoard.title || 'Boards', layoutType: 'board-matrix', group: group.group || '', subgroup: group.subgroup || '', rowLabel: row.length || '', rowDetail: '', columnLabel: column.variant || '', productKey: key });
            });
          });

          (ORDER_FORM_LAYOUT?.specialtyBoards || []).forEach((section, sectionIndex) => {
            (section.rows || []).forEach((row) => addPlacement({ sectionId: `specialtyBoards.${sectionIndex}`, sectionTitle: section.title || 'Specialty Boards', layoutType: 'list', group: '', subgroup: '', rowLabel: row.label || '', rowDetail: row.detail || '', columnLabel: '', productKey: row.key || '' }));
          });

          for (const [sectionId, section] of Object.entries(ORDER_FORM_LAYOUT?.sections || {})) {
            const type = section.type || '';
            if (type === 'matrix') {
              (section.rows || []).forEach((row) => {
                (row.cells || []).forEach((key, columnIndex) => {
                  if (!key) return;
                  addPlacement({ sectionId, sectionTitle: section.title || sectionId, layoutType: type, group: '', subgroup: '', rowLabel: row.label || '', rowDetail: row.detail || '', columnLabel: (section.columns || [])[columnIndex] || '', productKey: key });
                });
              });
            } else if (type === 'list') {
              (section.rows || []).forEach((row) => addPlacement({ sectionId, sectionTitle: section.title || sectionId, layoutType: type, group: '', subgroup: '', rowLabel: row.label || '', rowDetail: row.detail || '', columnLabel: '', productKey: row.key || '' }));
            } else if (type === 'insulation') {
              for (const [bucket, rows] of [['thermalRows', section.thermalRows], ['acousticRows', section.acousticRows]]) {
                (rows || []).forEach((row) => {
                  (row.cells || []).forEach((key, columnIndex) => {
                    if (!key) return;
                    addPlacement({ sectionId, sectionTitle: section.title || 'Insulation', layoutType: type, group: bucket, subgroup: '', rowLabel: row.label || '', rowDetail: row.detail || '', columnLabel: ['430 mm','580 mm'][columnIndex] || '', productKey: key });
                  });
                });
              }
            }
          }

          const placementRows = [
            ['Sequence','Section ID','Section Title','Layout Type','Group','Subgroup','Row Label','Row Detail','Column Label','Product Key'],
            ...placements.map(p => [p.sequence,p.sectionId,p.sectionTitle,p.layoutType,p.group,p.subgroup,p.rowLabel,p.rowDetail,p.columnLabel,p.productKey]),
          ];
          await writeFile('export/layout-placements.csv', placementRows.map(row => row.map(quote).join(',')).join('\n'));
          NODE
      - name: Upload catalogue export
        uses: actions/upload-artifact@v4
        with:
          name: order-form-catalog-export
          path: export
          if-no-files-found: error
          retention-days: 7
