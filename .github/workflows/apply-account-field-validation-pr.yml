name: Apply account validation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'account-field-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-field-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/apply-account-field-validation.py
      - run: npm test
      - run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions public tests package.json
          git diff --cached --quiet && exit 0
          git commit -m "Validate and normalise Account form fields"
          git push origin HEAD:account-field-validation
