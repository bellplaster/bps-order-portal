<body class="order-form-page">
  <header class="portal-header">
    <a class="brand-link" href="/" aria-label="Bell Plaster order portal">
      <img src="https://assets.bellplaster.com.au/bell_logo_black.png" alt="Bell Plaster">
    </a>
    <div class="portal-actions">
      <a class="header-button" href="/orders/">Orders</a>
      <a class="header-button" href="/account/">Account</a>
      <button id="logoutButton" class="header-button" type="button">Sign out</button>
    </div>
  </header>

  <nav class="two-step-nav" aria-label="Order progress">
    <button class="two-step-link is-active" type="button" data-step-target="form">
      <span class="step-index" aria-hidden="true">1</span>
      <span class="step-copy"><strong>Build order</strong><small>Details and products</small></span>
    </button>
    <span class="step-connector" aria-hidden="true"></span>
    <button class="two-step-link" type="button" data-step-target="review">
      <span class="step-index" aria-hidden="true">2</span>
      <span class="step-copy"><strong>Review</strong><small>Check and submit</small></span>
    </button>
  </nav>

  <div id="globalMessage" class="portal-message" hidden role="alert"></div>

  <main class="order-shell">
    <section id="adminOrderTools" class="admin-order-tools" aria-label="Administrator order testing" hidden></section>

    <form id="orderForm" novalidate>
      <div id="editModeBanner" class="edit-banner" hidden></div>

      <section class="step-panel is-active" data-step="form">
        <p id="accountSummary" class="account-summary" hidden></p>

        <section class="paper-section order-details-section" aria-labelledby="orderDetailsHeading">
          <h2 id="orderDetailsHeading" class="section-bar">Order details</h2>
          <input id="orderDate" type="hidden">
          <input id="orderDateIso" type="hidden">
          <input id="customerName" type="hidden">

          <div class="sheet-details-grid">
            <div class="sheet-field-row">
              <label for="reference">Reference</label>
              <input id="reference" type="text" inputmode="text" maxlength="80" autocomplete="off" autocapitalize="sentences" placeholder="Reference (optional)" aria-label="Reference, optional">
            </div>
            <div class="sheet-field-row">
              <label for="requiredDateDisplay">Required date</label>
              <input id="requiredDateDisplay" type="text" inputmode="numeric" maxlength="10" autocomplete="off" required placeholder="dd-mm-yyyy" aria-label="Required date, day month year">
              <input id="requiredDate" type="hidden">
            </div>
            <div class="sheet-field-row">
              <label for="contactName">Contact</label>
              <input id="contactName" type="text" maxlength="100" autocomplete="name" autocapitalize="words" required placeholder="Name">
            </div>
            <div class="sheet-field-row">
              <label for="contactMobile">Phone</label>
              <input id="contactMobile" type="tel" maxlength="18" inputmode="tel" autocomplete="tel" required placeholder="Phone">
            </div>
          </div>

          <section class="delivery-block" aria-labelledby="deliveryHeading">
            <h3 id="deliveryHeading" class="delivery-block-title">Delivery details</h3>
            <div class="delivery-grid delivery-grid-unified">
              <div class="delivery-address-field sheet-field-row sheet-field-wide">
                <label for="deliveryAddressSearch">Address</label>
                <div class="address-control">
                  <input id="deliveryAddressSearch" type="text" maxlength="500" autocomplete="off" autocapitalize="words" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="addressSearchResults" placeholder="Address">
                  <button id="clearAddressButton" class="clear-input" type="button" aria-label="Clear delivery address" hidden>×</button>
                  <div id="addressSearchResults" class="address-search-results" role="listbox" hidden></div>
                </div>
                <input id="deliveryAddress" type="hidden">
                <input id="deliveryAddressLine1" type="hidden">
                <input id="deliveryAddressLine2" type="hidden">
              </div>

              <fieldset class="form-field option-field time-slot-field">
                <legend>Time slot</legend>
                <div class="segmented-options compact-options">
                  <label><input type="radio" name="timeSlot" value="1ST"><span>1st</span></label>
                  <label><input type="radio" name="timeSlot" value="2ND"><span>2nd</span></label>
                  <label><input type="radio" name="timeSlot" value="AM"><span>AM</span></label>
                  <label><input type="radio" name="timeSlot" value="PM"><span>PM</span></label>
                  <label><input type="radio" name="timeSlot" value="ANY"><span>Any</span></label>
                </div>
              </fieldset>

              <div class="form-field delivery-notes-field">
                <span>Delivery instructions</span>
                <div class="generated-delivery-notes">
                  <div class="generated-notes-label"><span aria-hidden="true">●</span> Automatically added from the delivery selections</div>
                  <div id="generatedDeliverySummary" class="generated-notes-content" aria-live="polite"></div>
                </div>
                <label class="additional-instructions-label" for="deliveryInstructions">Instructions</label>
                <textarea id="deliveryInstructions" rows="3" maxlength="1500" autocapitalize="sentences" placeholder="Access, unloading or site notes"></textarea>
              </div>

              <div class="delivery-controls-stack">
                <fieldset class="form-field option-field delivery-type-field">
                  <legend>Delivery type</legend>
                  <div class="stacked-options">
                    <label><input type="radio" name="deliveryType" value="Hand Unload"><span>Hand Unload</span></label>
                    <label><input type="radio" name="deliveryType" value="Forklift Delivery"><span>Forklift Delivery</span></label>
                    <label><input type="radio" name="deliveryType" value="Crane Delivery"><span>Crane Delivery</span></label>
                    <label><input type="radio" name="deliveryType" value="Delivery (No Assistance)"><span>Delivery (No Assistance)</span></label>
                    <label><input type="radio" name="deliveryType" value="Pickup (Customer to collect)"><span>Customer Pickup</span></label>
                  </div>
                </fieldset>
                <fieldset class="form-field option-field extras-field">
                  <legend>Extras</legend>
                  <div class="stacked-options extras-options">
                    <label><input type="checkbox" name="deliveryExtra" value="Downstairs"><span>Downstairs</span></label>
                    <label><input type="checkbox" name="deliveryExtra" value="Upstairs"><span>Upstairs</span></label>
                    <label><input type="checkbox" name="deliveryExtra" value="Wrap"><span>Wrap</span></label>
                    <label><input type="checkbox" name="deliveryExtra" value="Strap"><span>Strap</span></label>
                    <label><input type="checkbox" name="deliveryExtra" value="Extra Labour"><span>Extra labour</span></label>
                  </div>
                </fieldset>
              </div>
            </div>
          </section>

          <label id="futureDateConfirmation" class="future-confirmation" hidden>
            <input id="confirmFutureRequiredDate" type="checkbox">
            <span>Confirm this date</span>
          </label>
        </section>

        <section class="products-area" aria-label="Products">
          <div class="floor-tabs" role="tablist" aria-label="Delivery areas"></div>
          <div class="floor-panels"></div>
        </section>

        <div class="form-actions form-actions-end">
          <button id="continueToReviewButton" class="button button-primary button-large" type="button">Review order <span aria-hidden="true">→</span></button>
        </div>
      </section>

      <section class="step-panel" data-step="review" hidden>
        <header class="review-heading"><h1>Review order</h1></header>
        <div class="review-paper">
          <section class="review-section">
            <div class="review-section-header"><h2>Order details</h2><button id="editFormButton" class="text-button" type="button">Edit</button></div>
            <div id="reviewDetails" class="review-details"></div>
          </section>
          <section class="review-section">
            <div class="review-section-header"><h2>Products</h2><button id="editProductsButton" class="text-button" type="button">Edit</button></div>
            <div id="reviewOrderLines" class="review-lines"></div>
            <div class="review-total"><span id="reviewLineTotal">0 product lines</span><strong id="reviewUnitTotal">0 total units</strong></div>
          </section>
        </div>
        <div id="formMessage" class="portal-message" hidden role="alert"></div>
        <div class="form-actions review-actions">
          <button id="backToFormButton" class="button button-secondary" type="button">← Back to order</button>
          <button id="submitButton" class="button button-primary" type="submit">Submit order</button>
        </div>
      </section>

      <section id="successScreen" class="success-screen" hidden aria-live="polite">
        <div class="success-mark" aria-hidden="true">✓</div>
        <h1 id="successTitle">Order created</h1>
        <p id="successSummary"></p>
        <div class="success-reference">Order number <strong id="orderNumberDisplay"></strong></div>
        <div id="generatedFiles" class="success-files"></div>
        <div class="form-actions success-actions">
          <a class="button button-secondary" href="/orders/">View orders</a>
          <button id="startNewOrderButton" class="button button-primary" type="button">Start new order</button>
        </div>
      </section>
    </form>
  </main>
