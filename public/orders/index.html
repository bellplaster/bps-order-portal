<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Orders | Bell Plaster Order Portal</title>
  <link rel="icon" type="image/png" href="https://assets.bellplaster.com.au/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260722-1">
  <link rel="stylesheet" href="/orders/orders.css?v=20260803-1">
</head>
<body class="orders-page">
  <header class="portal-header">
    <a class="brand-link" href="/" aria-label="Bell Plaster order portal">
      <img src="https://assets.bellplaster.com.au/bell_logo_black.png" alt="Bell Plaster">
    </a>
    <nav class="portal-actions" aria-label="Portal navigation">
      <a class="header-button" href="/">Order form</a>
      <a class="header-button is-current" href="/orders/" aria-current="page">Orders</a>
      <a class="header-button" href="/account/">Account</a>
      <button id="logoutButton" class="header-button" type="button">Sign out</button>
    </nav>
  </header>

  <main class="orders-shell">
    <header class="orders-heading">
      <div>
        <p class="orders-eyebrow">ORDER MANAGEMENT</p>
        <h1>Orders</h1>
        <p id="ordersScopeDescription">Loading your order history…</p>
      </div>
      <a class="button button-primary" href="/">Create order</a>
    </header>

    <div id="ordersMessage" class="orders-message" role="alert" hidden></div>

    <section class="orders-toolbar" aria-label="Order filters">
      <label class="orders-search">
        <span class="sr-only">Search orders</span>
        <input id="ordersSearch" type="search" autocomplete="off" placeholder="Search reference, customer, address or staff">
      </label>
      <label id="customerFilterField" class="orders-filter" hidden>
        <span>Customer</span>
        <select id="customerFilter"><option value="">All customers</option></select>
      </label>
      <label id="staffFilterField" class="orders-filter" hidden>
        <span>Placed by</span>
        <select id="staffFilter"><option value="">All staff</option></select>
      </label>
      <label class="orders-filter">
        <span>Status</span>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="completed">Completed</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <button id="refreshOrdersButton" class="orders-icon-button" type="button" aria-label="Refresh orders" title="Refresh orders">↻</button>
    </section>

    <div class="orders-results-heading">
      <strong id="ordersCount">0 orders</strong>
      <span id="ordersUpdated"></span>
    </div>

    <section id="ordersList" class="orders-list" aria-live="polite" aria-busy="true">
      <div class="orders-loading">Loading orders…</div>
    </section>
  </main>

  <dialog id="deleteOrderDialog" class="orders-dialog">
    <form id="deleteOrderForm" method="dialog">
      <header>
        <div>
          <p class="orders-eyebrow">PERMANENT ACTION</p>
          <h2>Delete order</h2>
        </div>
        <button id="closeDeleteDialog" class="orders-dialog-close" type="button" aria-label="Close">×</button>
      </header>
      <p id="deleteOrderMessage"></p>
      <label>
        <span id="deleteOrderLabel">Type the reference to confirm</span>
        <input id="deleteOrderConfirmation" autocomplete="off" required>
      </label>
      <footer>
        <button id="cancelDeleteOrder" class="button button-secondary" type="button">Cancel</button>
        <button id="confirmDeleteOrder" class="button button-danger" type="submit">Delete permanently</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/orders/orders.js?v=20260803-1"></script>
</body>
</html>
