<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Orders | Bell Plaster Order Portal</title>
  <link rel="icon" type="image/svg+xml" href="https://assets.bellplaster.com.au/favicon-round.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260722-1">
  <link rel="stylesheet" href="/orders/orders.css?v=20260805-2">
  <link rel="stylesheet" href="/portal-layout-width.css?v=20260805-1">
</head>
<body class="orders-page">
  <header class="portal-header">
    <a class="brand-link" href="/" aria-label="Bell Plaster order portal">
      <img src="https://assets.bellplaster.com.au/bell_logo_black.png" alt="Bell Plaster">
    </a>
    <nav class="portal-actions" aria-label="Portal navigation">
      <a id="orderFormLink" class="header-button" href="/">Order form</a>
      <a class="header-button is-current" href="/orders/" aria-current="page">Orders</a>
      <a id="accountLink" class="header-button" href="/account/">Account</a>
      <button id="logoutButton" class="header-button" type="button">Sign out</button>
    </nav>
  </header>

  <main class="orders-shell">
    <header class="orders-heading">
      <div>
        <p class="orders-eyebrow">ORDER MANAGEMENT</p>
        <h1>Orders</h1>
        <p id="ordersScopeDescription">Loading your order history…</p>
      </div>
      <a id="createOrderButton" class="button button-primary" href="/">Create order</a>
    </header>

    <div id="ordersMessage" class="orders-message" role="alert" hidden></div>

    <section class="orders-index-card" aria-label="Order history">
      <div class="orders-toolbar">
        <label class="orders-search">
          <span class="sr-only">Search orders</span>
          <input id="ordersSearch" type="search" autocomplete="off" placeholder="Search order, customer, address or contact">
        </label>
        <label id="customerFilterField" class="orders-filter" hidden>
          <span>Customer</span>
          <select id="customerFilter"><option value="">All customers</option></select>
        </label>
        <label id="staffFilterField" class="orders-filter" hidden>
          <span>Placed by</span>
          <select id="staffFilter"><option value="">All users</option></select>
        </label>
        <label class="orders-filter">
          <span>Status</span>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="archived">Archived</option>
          </select>
        </label>
        <label class="orders-filter orders-sort">
          <span>Sort</span>
          <select id="sortFilter">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="required">Required date</option>
          </select>
        </label>
        <button id="refreshOrdersButton" class="orders-icon-button" type="button" aria-label="Refresh orders" title="Refresh orders">↻</button>
      </div>

      <div class="orders-results-heading">
        <strong id="ordersCount">0 orders</strong>
        <span id="ordersUpdated"></span>
      </div>

      <div class="orders-table-wrap">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>Submitted</th>
              <th>Customer</th>
              <th>Required</th>
              <th>Delivery</th>
              <th class="orders-number-column">Items</th>
              <th class="orders-status-column">Status</th>
              <th class="orders-open-column"><span class="sr-only">Open</span></th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" aria-live="polite"></tbody>
        </table>
        <div id="ordersMobileList" class="orders-mobile-list" aria-live="polite"></div>
        <div id="ordersEmpty" class="orders-empty" hidden>No orders match the current filters.</div>
        <div id="ordersLoading" class="orders-loading">Loading orders…</div>
      </div>

      <footer class="orders-pagination">
        <span id="ordersRange">0 orders</span>
        <div>
          <button id="previousOrdersPage" type="button">Previous</button>
          <span id="ordersPageLabel">Page 1</span>
          <button id="nextOrdersPage" type="button">Next</button>
        </div>
      </footer>
    </section>
  </main>

  <script type="module" src="/orders/orders.js?v=20260805-1"></script>
</body>
</html>
